            </a>
        </li>
        <li>
            <a routerLink="/administrador/tickets" routerLinkActive="active">
                <span class="icono">🎫</span><span>Tickets</span>
            </a>
        </li>
        <li>

                <span class="icono">🔔</span><span>Notificaciones</span>
            </a>
        </li>

            <span class="icono">🚪</span><span>Cerrar sesión</span>
